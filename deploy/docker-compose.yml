services:
  kb-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - /data/npcbase/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - npcbase
    ports:
      - "127.0.0.1:9527:9527"
    volumes:
      - /data/npcbase/data/kb/runtime:/data/npcbase/data/kb
    restart: unless-stopped

networks:
  npcbase:
    external: true
    name: npcbase_default
